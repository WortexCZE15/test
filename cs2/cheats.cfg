// =========================================================
//  CS2 - cheaty pro hru s boty (offline / lokalni server)
//  Pouziti: v konzoli napis   exec cheats
//  Funguje jen na tvem lokalnim serveru (Hrat s boty).
// =========================================================

sv_cheats 1

// --- Penize a nakup ---
mp_maxmoney 60000
mp_startmoney 60000
mp_afterroundmoney 60000
mp_buy_anywhere 1
mp_buytime 9999

// --- Naboje a granaty ---
sv_infinite_ammo 1              // 1 = nekonecny zasobnik, 2 = nekonecne naboje v rezerve
ammo_grenade_limit_total 5
sv_grenade_trajectory_prac_pipreview 1   // nahled drahy granatu

// --- Kola a respawn ---
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_limitteams 0
mp_autoteambalance 0
mp_warmup_end

// --- Pomucky na trenink ---
sv_showimpacts 1                // ukaze, kam dopadaji strely
cl_showpos 1                    // souradnice a rychlost

// --- Bindy (klavesy) ---
bind "n" "noclip"               // litani skrz zdi
bind "g" "god"                  // nesmrtelnost zap/vyp
bind "h" "sv_rethrow_last_grenade"   // znovu hodi posledni granat
bind "j" "toggle host_timescale 1 0.3"  // zpomaleni casu zap/vyp
bind "k" "toggle bot_stop 0 1"  // zmrazeni botu zap/vyp

mp_restartgame 1
echo ">>> Cheaty nacteny! N=noclip G=god H=granat znovu J=zpomaleni K=zmrazit boty"
